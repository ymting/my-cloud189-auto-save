name: Build and Push to GHCR

# 允许手动触发工作流，也可以配置当推送到主干或开发分支时自动触发
on:
  workflow_dispatch:
    inputs:
      version:
        description: '输入要构建的镜像版本号 (例如: 1.0.0)，留空则自动从 package.json 读取'
        required: false
        default: ''
  push:
    branches: [ "main", "master", "dev", "concept" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 准备工作：读取版本号和生成标签
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.final_version.outputs.version }}
      version_tag: ${{ steps.image_tags.outputs.version_tag }}
      latest_tag: ${{ steps.image_tags.outputs.latest_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 从 package.json 读取版本号
        id: pkg_version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: 确定最终构建版本号
        id: final_version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION="${{ steps.pkg_version.outputs.version }}"
          FINAL="${INPUT_VERSION:-$PKG_VERSION}"
          echo "version=$FINAL" >> $GITHUB_OUTPUT
          echo "将使用版本号: $FINAL"

      - name: 生成分支镜像标签
        id: image_tags
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          VERSION="${{ steps.final_version.outputs.version }}"
          if [ "$BRANCH" = "dev" ]; then
            echo "version_tag=dev-$VERSION" >> $GITHUB_OUTPUT
            echo "latest_tag=dev-latest" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "concept" ]; then
            echo "version_tag=concept-$VERSION" >> $GITHUB_OUTPUT
            echo "latest_tag=concept-latest" >> $GITHUB_OUTPUT
          else
            echo "version_tag=$VERSION" >> $GITHUB_OUTPUT
            echo "latest_tag=latest" >> $GITHUB_OUTPUT
          fi

  # 构建 x86_64 (amd64) 镜像
  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version_tag }}-amd64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.latest_tag }}-amd64
          provenance: false

  # 构建 ARM64 镜像
  build-arm64:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version_tag }}-arm64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.latest_tag }}-arm64
          provenance: false

  # 合并多架构 manifest
  merge-manifests:
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          VERSION_TAG="${{ needs.prepare.outputs.version_tag }}"
          LATEST_TAG="${{ needs.prepare.outputs.latest_tag }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # 创建版本号 manifest
          docker buildx imagetools create -t ${IMAGE}:${VERSION_TAG} \
            ${IMAGE}:${VERSION_TAG}-amd64 \
            ${IMAGE}:${VERSION_TAG}-arm64

          # 创建 latest manifest
          docker buildx imagetools create -t ${IMAGE}:${LATEST_TAG} \
            ${IMAGE}:${LATEST_TAG}-amd64 \
            ${IMAGE}:${LATEST_TAG}-arm64

      - name: 清理架构特定标签（可选）
        run: |
          echo "多架构镜像已合并完成"
          echo "版本标签: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version_tag }}"
          echo "最新标签: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.latest_tag }}"
