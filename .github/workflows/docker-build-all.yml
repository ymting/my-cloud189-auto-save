name: Build Docker Images (Full Pipeline)

# 并行构建 amd64 和 arm64，然后合并 manifest
on:
  workflow_dispatch:
    inputs:
      version:
        description: '输入要构建的镜像版本号'
        required: false
        default: ''
  push:
    branches: [ "main", "master", "dev" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 构建 AMD64
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 从 package.json 读取版本号
        id: pkg_version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: 确定最终构建版本号
        id: final_version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION="${{ steps.pkg_version.outputs.version }}"
          FINAL="${INPUT_VERSION:-$PKG_VERSION}"
          echo "version=$FINAL" >> $GITHUB_OUTPUT
          echo "将使用版本号: $FINAL"

      - name: 生成分支镜像标签
        id: image_tags
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          VERSION="${{ steps.final_version.outputs.version }}"
          if [ "$BRANCH" = "dev" ]; then
            echo "version_tag=dev-$VERSION-amd64" >> $GITHUB_OUTPUT
            echo "latest_tag=dev-latest-amd64" >> $GITHUB_OUTPUT
          else
            echo "version_tag=$VERSION-amd64" >> $GITHUB_OUTPUT
            echo "latest_tag=latest-amd64" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tags.outputs.version_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tags.outputs.latest_tag }}
          provenance: false

  # 构建 ARM64
  build-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 从 package.json 读取版本号
        id: pkg_version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: 确定最终构建版本号
        id: final_version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION="${{ steps.pkg_version.outputs.version }}"
          FINAL="${INPUT_VERSION:-$PKG_VERSION}"
          echo "version=$FINAL" >> $GITHUB_OUTPUT
          echo "将使用版本号: $FINAL"

      - name: 生成分支镜像标签
        id: image_tags
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          VERSION="${{ steps.final_version.outputs.version }}"
          if [ "$BRANCH" = "dev" ]; then
            echo "version_tag=dev-$VERSION-arm64" >> $GITHUB_OUTPUT
            echo "latest_tag=dev-latest-arm64" >> $GITHUB_OUTPUT
          else
            echo "version_tag=$VERSION-arm64" >> $GITHUB_OUTPUT
            echo "latest_tag=latest-arm64" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tags.outputs.version_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tags.outputs.latest_tag }}
          provenance: false

  # 合并 manifest
  merge-manifests:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 从 package.json 读取版本号
        id: pkg_version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: 确定最终版本号
        id: final_version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION="${{ steps.pkg_version.outputs.version }}"
          FINAL="${INPUT_VERSION:-$PKG_VERSION}"
          echo "version=$FINAL" >> $GITHUB_OUTPUT
          echo "将使用版本号: $FINAL"

      - name: 生成分支镜像标签
        id: image_tags
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          VERSION="${{ steps.final_version.outputs.version }}"
          if [ "$BRANCH" = "dev" ]; then
            echo "version_tag=dev-$VERSION" >> $GITHUB_OUTPUT
            echo "latest_tag=dev-latest" >> $GITHUB_OUTPUT
          else
            echo "version_tag=$VERSION" >> $GITHUB_OUTPUT
            echo "latest_tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          VERSION_TAG="${{ steps.image_tags.outputs.version_tag }}"
          LATEST_TAG="${{ steps.image_tags.outputs.latest_tag }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "=== 合并多架构镜像 ==="
          echo "版本标签: ${IMAGE}:${VERSION_TAG}"
          echo "最新标签: ${IMAGE}:${LATEST_TAG}"

          # 创建版本号 manifest
          docker buildx imagetools create -t ${IMAGE}:${VERSION_TAG} \
            ${IMAGE}:${VERSION_TAG}-amd64 \
            ${IMAGE}:${VERSION_TAG}-arm64

          # 创建 latest manifest
          docker buildx imagetools create -t ${IMAGE}:${LATEST_TAG} \
            ${IMAGE}:${LATEST_TAG}-amd64 \
            ${IMAGE}:${LATEST_TAG}-arm64

          echo "=== 合并完成 ==="
