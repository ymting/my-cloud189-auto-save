name: Build and Push Docker Image

# 允许手动触发工作流
on:
  workflow_dispatch:
    inputs:
      version:
        description: '输入要构建的镜像版本号'
        required: true
        default: '1.0.0'

jobs:
  # 构建 x86_64 (amd64) 镜像
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud189-auto-save:${{ github.event.inputs.version }}-amd64
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud189-auto-save:latest-amd64
          provenance: false

  # 构建 ARM64 镜像
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud189-auto-save:${{ github.event.inputs.version }}-arm64
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud189-auto-save:latest-arm64
          provenance: false

  # 合并多架构 manifest
  merge-manifests:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          VERSION="${{ github.event.inputs.version }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/cloud189-auto-save"

          # 创建版本号 manifest
          docker buildx imagetools create -t ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

          # 创建 latest manifest
          docker buildx imagetools create -t ${IMAGE}:latest \
            ${IMAGE}:latest-amd64 \
            ${IMAGE}:latest-arm64

      - name: 构建完成
        run: |
          echo "多架构镜像已合并完成"
          echo "版本标签: ${{ secrets.DOCKERHUB_USERNAME }}/cloud189-auto-save:${{ github.event.inputs.version }}"
          echo "最新标签: ${{ secrets.DOCKERHUB_USERNAME }}/cloud189-auto-save:latest"
