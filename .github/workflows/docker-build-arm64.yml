name: Build Docker Image (ARM64)

# 构建 ARM64 镜像
on:
  workflow_dispatch:
    inputs:
      version:
        description: '输入要构建的镜像版本号'
        required: true
        default: '1.0.0'
  push:
    branches: [ "main", "master", "dev" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 从 package.json 读取版本号
        id: pkg_version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: 确定最终构建版本号
        id: final_version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          PKG_VERSION="${{ steps.pkg_version.outputs.version }}"
          FINAL="${INPUT_VERSION:-$PKG_VERSION}"
          echo "version=$FINAL" >> $GITHUB_OUTPUT
          echo "将使用版本号: $FINAL"

      - name: 生成分支镜像标签
        id: image_tags
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          VERSION="${{ steps.final_version.outputs.version }}"
          if [ "$BRANCH" = "dev" ]; then
            echo "version_tag=dev-$VERSION-arm64" >> $GITHUB_OUTPUT
            echo "latest_tag=dev-latest-arm64" >> $GITHUB_OUTPUT
          else
            echo "version_tag=$VERSION-arm64" >> $GITHUB_OUTPUT
            echo "latest_tag=latest-arm64" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push arm64 image to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud189-auto-save:${{ steps.image_tags.outputs.version_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud189-auto-save:${{ steps.image_tags.outputs.latest_tag }}
          provenance: false

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tags.outputs.version_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tags.outputs.latest_tag }}
          provenance: false
