name: Merge Docker Manifests

# 合并多架构 manifest（在 amd64 和 arm64 构建完成后调用）
on:
  workflow_dispatch:
    inputs:
      version:
        description: '输入要合并的镜像版本号'
        required: true
        default: '1.0.0'
      push_latest:
        description: '是否同时更新 latest 标签'
        required: true
        default: 'true'
        type: boolean
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      push_latest:
        required: true
        type: boolean
        default: true

jobs:
  merge-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          VERSION="${{ inputs.version }}"
          PUSH_LATEST="${{ inputs.push_latest }}"
          DOCKERHUB_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/cloud189-auto-save"
          GHCR_IMAGE="ghcr.io/${{ github.repository }}"

          echo "=== 合并 Docker Hub 多架构镜像 ==="
          docker buildx imagetools create -t ${DOCKERHUB_IMAGE}:${VERSION} \
            ${DOCKERHUB_IMAGE}:${VERSION}-amd64 \
            ${DOCKERHUB_IMAGE}:${VERSION}-arm64

          echo "=== 合并 GHCR 多架构镜像 ==="
          docker buildx imagetools create -t ${GHCR_IMAGE}:${VERSION} \
            ${GHCR_IMAGE}:${VERSION}-amd64 \
            ${GHCR_IMAGE}:${VERSION}-arm64

          if [ "$PUSH_LATEST" = "true" ]; then
            echo "=== 更新 Docker Hub latest 标签 ==="
            docker buildx imagetools create -t ${DOCKERHUB_IMAGE}:latest \
              ${DOCKERHUB_IMAGE}:${VERSION}-amd64 \
              ${DOCKERHUB_IMAGE}:${VERSION}-arm64

            echo "=== 更新 GHCR latest 标签 ==="
            docker buildx imagetools create -t ${GHCR_IMAGE}:latest \
              ${GHCR_IMAGE}:${VERSION}-amd64 \
              ${GHCR_IMAGE}:${VERSION}-arm64
          fi

      - name: 构建完成摘要
        run: |
          VERSION="${{ inputs.version }}"
          echo "## 多架构镜像合并完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/cloud189-auto-save:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            echo "- \`${{ secrets.DOCKERHUB_USERNAME }}/cloud189-auto-save:latest\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GHCR" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            echo "- \`ghcr.io/${{ github.repository }}:latest\`" >> $GITHUB_STEP_SUMMARY
          fi
